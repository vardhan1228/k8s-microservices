apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PORT: "5000"
  FLASK_DEBUG: "false"

  DB_HOST: "mysql-service"
  DB_USER: "root"
  DB_PASSWORD: "root"
  DB_NAME: "cloud"

  MAIL_SERVER: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "vvardhan2211@gmail.com"
  MAIL_PASSWORD: "czvk tjjz kiea qrbu"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend-container
          image: 413117505476.dkr.ecr.us-east-1.amazonaws.com/shopping-site-backend:daf50583894e25e8de24a525db469a065e714219
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: backend-config

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: ClusterIP